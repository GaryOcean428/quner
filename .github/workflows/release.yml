name: Validate and publish quner

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quner-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Check version and production ancestry
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "$RELEASE_TAG" = "v$VERSION"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Install build and sandbox tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]' build twine uv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Layer-A sandbox (fake hardware only)
        run: bash sandbox/run_sandbox.sh
      - name: Build and validate distributions
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quner-dist
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quner-dist
          path: dist/
      - name: Publish using PyPI trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Verify uploaded files against PyPI
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, pathlib, time, urllib.request
          url = 'https://pypi.org/pypi/quner/' + os.environ['RELEASE_VERSION'] + '/json'
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('dist').iterdir()}
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      files = json.load(response)['urls']
                  actual = {p['filename']: p['digests']['sha256'] for p in files}
                  if expected and all(actual.get(name) == digest for name, digest in expected.items()):
                      print('Verified wheel and sdist hashes on PyPI')
                      break
              except (OSError, ValueError, KeyError):
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Published distributions not verified on PyPI')
          PYTHON
